name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
            numpy: 'numpy==1.26.4'
          - os: ubuntu-latest
            python: '3.12'
            numpy: 'numpy>=2,<3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install NumPy
        run: python -m pip install "${{ matrix.numpy }}"
      - name: Run headless regression tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q beyond.py beyond_field.py tests
